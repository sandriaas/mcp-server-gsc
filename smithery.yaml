# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

runtime: container

build:
  dockerfile: Dockerfile
  dockerBuildPath: .

startCommand:
  type: http
  # Expose GOOGLE_APPLICATION_CREDENTIALS from config
  configSchema:
    type: object
    required:
      - googleCredentialsPath
    properties:
      googleCredentialsPath:
        type: string
        description: Path to the Google Cloud service account credentials JSON file.
  commandFunction: |
    config => ({
      command: 'bash',
      args: ['-lc', 'set -e; if [ -n "$GOOGLE_CREDENTIALS_JSON_B64" ]; then echo "$GOOGLE_CREDENTIALS_JSON_B64" | base64 -d > /app/credentials.json; fi; node .smithery/index.cjs'],
      env: { GOOGLE_APPLICATION_CREDENTIALS: config.googleCredentialsPath }
    })